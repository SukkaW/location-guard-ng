name: Deploy to Pages

on:
  push:
    branches:
      - master
    paths:
      - packages/web/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          check-latest: true
          cache: "pnpm"
      - run: pnpm config set --location=global minimumReleaseAge 0
      - run: pnpm install
      - run: pnpm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          # Next.js static export output (`output: 'export'` in packages/web/next.config.js)
          path: "./packages/web/out"
      - uses: actions/deploy-pages@v5
        id: deployment
